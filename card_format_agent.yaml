        đãi thẻ\n* Mã tài liệu: `documents/the/tong-hop-uu-dai-the` (Loại: Reference
        Data)\n* File gốc soi chiếu: `documents/the/tong-hop-uu-dai-the.md`\n* Kênh
        áp dụng: App MBBank, POS MB\n* Đối tượng: Tất cả chủ thẻ MB JCB (thẻ ghi nợ
        và thẻ tín dụng)    Thời gian khuyến mãi: - Giai đoạn 1: Từ 05/06/2026 - 30/06/2026
        - Giai đoạn 2: Từ 01/07/2026 - 31/07/2026 - Giai đoạn 3: Từ 01/08/2026 - 31/08/2026
        Chỉ áp dụng với các giao dịch chi tiêu trực tiếp (face-to-face) tại nước ngoài\n*
        Quy trình liên quan: Kích hoạt thẻ\n* Nội dung chi tiết:\n# Tổng quan\nTài
        liệu cung cấp danh mục chi tiết các chương trình khuyến mại, ưu đãi giảm giá
        trực tiếp, hoàn tiền (cashback) và đặc quyền dịch vụ dành cho các dòng thẻ
        thanh toán quốc tế của MB (Visa, Mastercard, JCB across Mass, Priority, Private).\n\n#
        Điểm chính\n- **Ưu đãi kích hoạt / Nhận hạn mức lần đầu**: Hoàn từ 150.000
        VNĐ đến 1.000.000 VNĐ khi đạt số lượng giao dịch (3–5 giao dịch) và doanh
        số chi tiêu tối thiểu trong vòng 30–45 ngày kể từ ngày kích hoạt thẻ có hạn
        mức.\n- **Tính năng hoàn tiền định kỳ (CVP)**:\n  - Thẻ Mastercard Platinum:
        Hoàn 5% (tối đa 600K/kỳ sao kê) theo các gói chi tiêu tự chọn (Hàng ngày,
        Phong cách sống, Du lịch); giảm 75% phí chuyển đổi ngoại tệ tại POS nước ngoài
        (còn 0,5%).\n  - Thẻ Visa: Hoàn 3% - 10% cho chi tiêu online (Shopee, Tiki)
        ngày đôi và ẩm thực/di chuyển; nhân đôi tỷ lệ vào tháng sinh nhật (tối đa
        300K - 400K/kỳ).\n  - Thẻ JCB: Hoàn tiền chi tiêu tại cửa hàng tiện lợi, di
        chuyển, Shopee, TikTok Shop, bảo hiểm, y tế, giáo dục lên tới 10% (tối đa
        100K - 800K/kỳ tuỳ hạng thẻ).\n  - Thẻ Hi Slaydy / Hi Ads / Hi Cashback /
        VETC: Hoàn tiền chuyên biệt theo lĩnh vực làm đẹp, chi tiêu quảng cáo, phí
        di chuyển xăng dầu.\n- **Ưu đãi đối tác theo ngành hàng**:\n  - *Mua sắm &
        TMĐT*: Giảm giá trực tiếp tại Shopee, Uniqlo, Fahasa, ABC-Mart, chuỗi cửa
        hàng tiện lợi (Aeon Citimart, Ministop, FamilyMart), siêu thị điện máy (FPT
        Shop, Thế giới di động, Điện máy Chợ Lớn, Nguyễn Kim, Viettel Store).\n  -
        *Ẩm thực*: Giảm giá tới 50% hoặc 500K - 1.000.000 VNĐ tại chuỗi nhà hàng Michelin,
        Haidilao, Golden Gate, Manwah, iSushi, Kampong Chicken House, McDonald\''s,
        Starbucks, Gong Cha.\n  - *Du lịch & Khách sạn*: Giảm giá đặt vé máy bay và
        phòng khách sạn trên Agoda, Traveloka, Trip.com, Klook, Hotels.com, Qatar
        Airways, Vietnam Airlines; ưu đãi lưu trú tại Mövenpick, Banyan Tree, Frasers
        Hospitality, Fusion Hotel Group.\n  - *Đặc quyền cao cấp (Priority/Private)*:
        Miễn phí phòng chờ sân bay thương gia nội địa/quốc tế, dịch vụ đón tiễn Meet
        & Greet, ưu đãi giảm giá/tặng lượt dịch vụ chơi Golf, quyền lợi hội viên khách
        sạn cao cấp (CentaraThe1, HoteLux, MyMillennium, Little Emperors).\n- **Chi
        tiêu ngoại tệ**: Miễn phí hoặc hoàn 100% phí chuyển đổi ngoại tệ tại POS nước
        ngoài/Apple Pay theo từng giai đoạn; hoàn tiền thêm khi đạt mốc doanh số chi
        tiêu ngoại tệ quy định.\n\n# Hướng dẫn kích hoạt thẻ trên App MBBank\n1. Đăng
        nhập App MBBank.\n2. Vào mục **Dịch vụ Thẻ** -> Mở danh sách tất cả thẻ.\n3.
        Chọn thẻ cần kích hoạt -> Nhấn **Kích hoạt thẻ**.\n4. Xác thực bằng mã OTP
        để hoàn tất.\n\n# Dữ liệu\n\n### Sheet: Mastercard Platinum\n| Cột 1 | Lĩnh
