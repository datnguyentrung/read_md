[package]
name = "prompt-compiler-optimizer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "prompt_compiler_optimizer"
path = "scripts/lib.rs"

[[bin]]
name = "run_pipeline"
path = "scripts/run_pipeline.rs"

[[bin]]
name = "ir_validator"
path = "scripts/ir_validator.rs"

[[bin]]
name = "graph_analyzer"
path = "scripts/graph_analyzer.rs"

[[bin]]
name = "prompt_metrics"
path = "scripts/prompt_metrics.rs"

[[bin]]
name = "invariant_checker"
path = "scripts/invariant_checker.rs"

[[bin]]
name = "regression_runner"
path = "scripts/regression_runner.rs"

[[bin]]
name = "artifact_manager"
path = "scripts/artifact_manager.rs"

[[test]]
name = "test_pipeline"
path = "tests/test_pipeline.rs"
